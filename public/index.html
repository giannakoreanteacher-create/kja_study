<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>한국어 단어 카드</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="screen-home" class="screen">
      <h1>Korean Vocabulary Cards</h1>
      <div class="how-to">
        <div class="how-to-step"><span class="step-emoji">🎯</span><span><b>Step 1.</b> Pick a level</span></div>
        <div class="how-to-step"><span class="step-emoji">🔄</span><span><b>Step 2.</b> Tap the card to reveal the meaning</span></div>
        <div class="how-to-step"><span class="step-emoji">👍</span><span><b>Step 3.</b> Mark Know or Don't Know</span></div>
        <div class="how-to-step"><span class="step-emoji">📚</span><span><b>Step 4.</b> Words marked Don't Know are saved — tap Review All anytime</span></div>
      </div>
      <p class="how-to-note">📅 You can study up to 30 new words per level each day.</p>
      <p id="home-date" class="home-date"></p>
      <div id="level-list" class="level-list"></div>
      <div id="review-all-section"></div>
    </section>

    <section id="screen-study" class="screen" hidden>
      <button class="back-btn" id="study-back-btn">← Home</button>
      <div class="card-stage">
        <div id="card" class="card">
          <div class="card-face card-front">
            <p id="card-front-pos" class="card-pos"></p>
            <p id="card-front-emoji" class="card-emoji"></p>
            <p id="card-front-word" class="card-word"></p>
          </div>
          <div class="card-face card-back">
            <p id="card-back-meaning" class="card-meaning"></p>
          </div>
        </div>
      </div>
      <div class="swipe-row">
        <button id="swipe-dont-know" class="swipe-btn dont-know">← Don't Know</button>
        <button id="swipe-know" class="swipe-btn know">Know →</button>
      </div>
    </section>

    <section id="screen-complete" class="screen" hidden>
      <p id="complete-message" class="complete-message"></p>
      <div class="complete-actions">
        <button id="complete-review-btn" class="primary-btn" hidden>Review</button>
        <button id="complete-home-btn" class="primary-btn">Home</button>
      </div>
    </section>

    <section id="screen-review" class="screen" hidden>
      <button class="back-btn" id="review-back-btn">← Home</button>
      <div id="review-gallery" class="review-gallery"></div>
    </section>
  </main>

  <script src="words.js"></script>
  <script src="progress.js"></script>
  <script src="app.js"></script>
</body>
</html>
